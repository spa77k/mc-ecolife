# エコライフアシストの設定。
#
# ログインボーナスの考え方:
#   報酬は「その月に受け取った回数」で決まる。1回目なら1マス目、2回目なら2マス目。
#   休んでもマスは戻らないが進みもしないため、休んだ日数ぶんだけ月の後ろのマスに届かなくなる。
#   月が変わると1マス目に戻る。良いものほど後ろのマスに置いてある。
#
# 中身の考え方:
#   Jobs Reborn の1時間あたり収入上限が 1000+500*(合計レベル/100)（spsmc-infra/plugins/Jobs/generalConfig.yml）で、
#   駆け出しのプレイヤーで時給はおよそ1000S。前半は「その日の作業がはかどる消耗品」を置き、
#   採掘や取引で稼ぐ価値を下げないようにしている。ダイヤなど値の張るものは、
#   毎日欠かさず入った人だけが届く後半（21日目以降）に限っている。

# 1日の区切り。
day:
  # 判定に使うタイムゾーン。空にするとサーバーの既定（compose.yml の TZ=Asia/Tokyo）を使う。
  timezone: "Asia/Tokyo"
  # 何時に日付が変わる扱いにするか（0〜23）。月の切り替わりも同じ区切りで判定する。
  # 深夜0時ではなく朝4時にしているのは、日付をまたいで遊んでいる人の受け取りが
  # プレイ中に切り替わらないようにするため。
  reset-hour: 4

login-bonus:
  enabled: true

  # 参加してから自動で受け取るまでの待ち時間（ティック）。20ティックで1秒。
  # 参加直後は first-join-guide などの案内が重なるため、少し遅らせて流れないようにする。
  claim-delay-ticks: 60

  # 月の日数ぶんすべて受け取った人が出たら、サーバー全体に知らせる。
  broadcast-perfect-month: true

# サーバー内の出来事（依頼板・オークションなど）をDiscordへ知らせる。
#
# 発生元プラグイン（ContractBoard / AuctionHouse など）はコンパイル時依存にしない。
# Class.forName でクラス名を解決して動的に購読するため、見つからなければそのプラグインが
# 未導入だとみなしてその購読だけを諦める。起動そのものは必ず成功する。
notify:
  # 既定は無効。webhook-url が空、または ${...} のまま（spsmc-infra の起動時置換が
  # 効いていない）のときも、enabled: true にしていても実際には送信しない。
  enabled: false

  # Discord の Webhook URL。直書きせず、spsmc-infra 側で環境変数を埋め込む前提。
  webhook-url: "${CFG_ECOLIFE_DISCORD_WEBHOOK}"

  # Webhookの表示名とアイコン。avatar-url を空にすると、Webhook作成時に設定した既定を使う。
  username: "SPSMCお知らせ"
  avatar-url: ""

  # HTTP接続・応答待ちの上限（秒）。短めにしているのは、Discord側の障害が起きても
  # 送信専用スレッドが長時間詰まったままにならないようにするため。
  connect-timeout-seconds: 5
  request-timeout-seconds: 10

  # 送信待ちキューの上限。あふれたぶんは待たせずに捨て、捨てた件数だけログにまとめて残す。
  queue-max-size: 200

  # 全体の毎分送信上限。Discord Webhookのレート制限（概ね1分30回）に余裕を持って収める。
  max-per-minute: 20

  # プレイヤー入力（依頼タイトル・アイテム名など）を貼り付ける1項目あたりの長さ上限。
  # 超えたぶんは末尾を … に置き換える。
  text-max-length: 80

  # 通知の発生元。キーは自由に増やせる。新しいプラグインを足すときはここに1件追記するだけでよく、
  # EcoLifeAssist 側のコード変更は要らない。
  sources:
    contract-created:
      enabled: true
      # mc-irai（ContractBoard）が投げるイベントの完全修飾クラス名。
      event: "net.mcirai.contractboard.event.ContractCreatedEvent"
      # {player} などは、発生元イベントの getNotifyPlaceholders() から差し込む。
      template: "📋 **{player}** さんが新しい依頼「{title}」を出しました（報酬 {reward} / 期限 {expire_hours}時間）"
      # この種別の最短送信間隔（秒）。依頼の連投で通知が埋まらないようにする。
      min-interval-seconds: 60
      # 同一プレイヤーからの連投を抑える間隔（秒）。
      per-player-cooldown-seconds: 300
    auction-listed:
      enabled: true
      # mc-auction（AuctionHouse）が投げるイベントの完全修飾クラス名。
      event: "net.mcauction.auctionhouse.event.AuctionListedEvent"
      template: "🔨 **{player}** さんが「{item}」を{amount}個 出品しました（開始価格 {start_price}）"
      min-interval-seconds: 60
      per-player-cooldown-seconds: 300

# 全自動装置の疑いがある場所を、運営専用のDiscordへ知らせる。通知だけで、装置には手を出さない。
#
# ルールの基準は「プレイヤーがその場で操作しないと止まるか」。
# 近くのプレイヤーが全員放置中（または誰もいない）なのに、搬送・回収・ピストン・
# プレイヤー以外によるモブの死亡などが続いているチャンクを見つける。
# 自分で倒すトラップや、ボタンを押している間だけ動く半自動装置は、操作した本人が
# アクティブ扱いになるため対象にならない。
# 通知には座標・BlueMapのリンク・土地の持ち主（GriefPrevention）・装置を置いた人（CoreProtect）を載せる。
# 一度通知した場所（ワールド＋チャンク）は plugins/EcoLifeAssist/automation.db に残し、二度と通知しない。
# 記録は SPSMCInsight が週次の出力（automation.jsonl）に含める。
automation-watch:
  enabled: false

  # 座標が載るため、一般プレイヤーが見るチャンネルとは別の運営専用Webhookにする。
  # 未設定でも検出はサーバーログと automation.db に残し、設定後に未送信分を送る。
  webhook-url: "${CFG_ECOLIFE_AUTOMATION_WEBHOOK}"
  username: "自動化装置の検出"
  avatar-url: ""

  # 通知に「地図で見る」リンクを付ける BlueMap の公開URL。空にするとリンクを付けない。
  # 地図IDは BlueMap のAPIからワールドごとに引く。
  bluemap-url: "https://map.spa77.works/"

  # このブロック数以内（水平距離）にアクティブなプレイヤーがいれば「操作中」とみなす。
  radius-blocks: 64
  # 最後の自発操作（ジャンプ・ダッシュ・スニーク・設置・破壊・右クリック・攻撃・インベントリ操作）から
  # この秒数を過ぎたら放置中とみなす。McLevel のアクティブ判定と同じ60秒。
  afk-seconds: 60

  # 直近 window-minutes 分がすべて放置中で、そのうち min-active-minutes 分以上で動きがあり、
  # 動きの点数の合計が min-score 以上なら通知する。
  # 手で入れた荷物をホッパーが運び終えるまでの数分は拾わないよう、10分見てから判断する。
  window-minutes: 10
  min-active-minutes: 8
  min-score: 200

  # 動き1回あたりの点数。鉄トラップのように回路を使わない装置は、搬送・回収より
  # 「プレイヤー以外によるモブの死亡」で見つかるため重くしている。
  weights:
    transfer: 1
    pickup: 1
    piston: 1
    dispense: 1
    mob-death: 10

  # 検出しないワールド名。
  excluded-worlds: []

  # 集計の区切り（秒）。通常は60のまま使う。
  check-interval-seconds: 60

# 死亡時の持ち物をお墓に預ける。本人がお墓を右クリック（統合版はタップ）すると、空いている元のスロットへ戻る。
# 期限が過ぎると中身はその場に落ち、お墓がないときと同じ扱い（時間がたつと消える）になる。
# 中身は plugins/EcoLifeAssist/graves.yml に保存するため、再起動をまたいでも残る。
# keepInventory が有効なワールドではお墓を作らない。
grave:
  enabled: true
  # 本人だけが取り出せる時間（分）。サーバー停止中も時間は進む。
  expire-minutes: 15
  # 死亡時に落ちる経験値（バニラと同じ量）もお墓に預ける。
  keep-exp: true
  # お墓を作らないワールド名。
  excluded-worlds: []

# 溶岩と水で生まれた石（石製造機）を掘っても、Jobs の職業報酬（お金・ポイント・職業経験値）を出さない。
# 生まれた場所をチャンクに記録するので、再起動をまたいでも効く。ピストンで動いた石も追いかける。
# 自然の石やプレイヤーが置いた石には影響しない。Jobs が入っていないときは何もしない。
generator-stone:
  enabled: true
  # 対象にするブロック。溶岩が水（玄武岩は青氷）に触れて生まれるもの。
  materials: [STONE, COBBLESTONE, BASALT]

# 受け取ったときの演出。
effects:
  title: true
  sound: ENTITY_PLAYER_LEVELUP

# 毎月同じカレンダーの中身。下の monthly-rewards.start より前の月に使う。キーが「その月の何マス目か」。
# 2月は最大28マス目まで、31日ある月だけ31マス目に届く。
# 1マスに複数のアイテムを置ける。material はバニラのアイテム名。
# adminshop-item は AdminShop が生成する効果付き商品ID。利用できない日は受け取りを保留する。
rewards:
  1:
    - { material: BREAD, amount: 16 }
  2:
    - { material: TORCH, amount: 32 }
  3:
    - { material: COAL, amount: 16 }
  4:
    - { material: COOKED_BEEF, amount: 8 }
  5:
    - { material: IRON_INGOT, amount: 4 }
  6:
    - { material: ARROW, amount: 32 }
  # 1週間ぶんの節目。
  7:
    - { material: EXPERIENCE_BOTTLE, amount: 8 }
    - { material: BREAD, amount: 16 }
  8:
    - { material: BREAD, amount: 24 }
  9:
    - { material: TORCH, amount: 48 }
  10:
    - { material: BONE_MEAL, amount: 32 }
  11:
    - { material: IRON_INGOT, amount: 8 }
  12:
    - { material: COOKED_BEEF, amount: 16 }
  13:
    - { material: GOLD_INGOT, amount: 4 }
  # 2週間ぶんの節目。
  14:
    - { adminshop-item: return_charm }
  15:
    - { material: COAL_BLOCK, amount: 4 }
  16:
    - { material: IRON_INGOT, amount: 12 }
  17:
    - { material: ARROW, amount: 64 }
  18:
    - { material: LAPIS_LAZULI, amount: 32 }
  19:
    - { material: GOLDEN_APPLE, amount: 1 }
  20:
    - { material: GOLD_INGOT, amount: 8 }
  # 3週間ぶんの節目。ここから値の張るものが出る。
  21:
    - { material: DIAMOND, amount: 1 }
    - { material: EXPERIENCE_BOTTLE, amount: 8 }
  22:
    - { material: EXPERIENCE_BOTTLE, amount: 16 }
  23:
    - { material: IRON_BLOCK, amount: 1 }
  24:
    - { material: ENDER_PEARL, amount: 4 }
  25:
    - { material: OBSIDIAN, amount: 8 }
  26:
    - { material: EMERALD, amount: 4 }
  27:
    - { material: GOLDEN_APPLE, amount: 2 }
  # 4週間ぶんの節目。
  28:
    - { material: DIAMOND, amount: 2 }
    - { material: EXPERIENCE_BOTTLE, amount: 16 }
  29:
    - { material: EXPERIENCE_BOTTLE, amount: 24 }
  30:
    - { material: DIAMOND, amount: 3 }
  # 31日ある月を皆勤した人だけが届くマス。
  31:
    - { material: DIAMOND, amount: 4 }
    - { material: GOLDEN_APPLE, amount: 1 }

# 月替わりのカレンダー。start の月から、毎月のマスを段階ごとの候補から抽選する。
# start より前の月は、上の rewards を使う。start を空にすると、毎月 rewards を使う。
#
# 抽選はその月で最初に必要になったとき（受け取りや /daily）に1回だけ行い、
# plugins/EcoLifeAssist/calendars.yml に保存する。以後その月は保存した中身を使うため、
# 再起動や候補の書き換えで抽選済みの月の中身は変わらない。変更は次の抽選から効く。
#
# 段階ごとに、slots のマスへ candidates から1つずつ置く。同じ月の同じ段階では、
# 同じ候補を2回使わない。候補1つは [ ... ] の中に1個以上のアイテムを書く。
# 書き方は rewards と同じで、adminshop-item にも amount を付けられる。
# 値の張るものは後ろの段階にだけ置き、前半は「その日の作業がはかどる消耗品」にしている。
# サーバー全体に効く AdminShop 商品（豊穣の鐘など）は、1人の受け取りで全員に効くため候補にしない。
monthly-rewards:
  start: "2026-11"
  pools:
    early:
      slots: [1, 2, 3, 4, 5, 6, 8, 9, 10, 11, 12, 13]
      candidates:
        - [{ material: BREAD, amount: 16 }]
        - [{ material: COOKED_BEEF, amount: 8 }]
        - [{ material: TORCH, amount: 32 }]
        - [{ material: COAL, amount: 16 }]
        - [{ material: IRON_INGOT, amount: 4 }]
        - [{ material: ARROW, amount: 32 }]
        - [{ material: BONE_MEAL, amount: 32 }]
        - [{ material: EXPERIENCE_BOTTLE, amount: 4 }]
        - [{ material: COOKED_PORKCHOP, amount: 8 }]
        - [{ material: BAKED_POTATO, amount: 16 }]
        - [{ material: OAK_LOG, amount: 32 }]
        - [{ material: REDSTONE, amount: 16 }]
        - [{ material: GOLD_INGOT, amount: 2 }]
        - [{ material: LEAD, amount: 2 }]
        - [{ material: NAME_TAG, amount: 1 }]
        - [{ material: COPPER_INGOT, amount: 16 }]
    # 1週間の節目。
    week1:
      slots: [7]
      candidates:
        - [{ material: EXPERIENCE_BOTTLE, amount: 8 }, { material: BREAD, amount: 16 }]
        - [{ material: IRON_INGOT, amount: 8 }, { material: TORCH, amount: 32 }]
        - [{ material: GOLDEN_CARROT, amount: 8 }, { material: ARROW, amount: 32 }]
    # 2週間の節目。
    week2:
      slots: [14]
      candidates:
        - [{ adminshop-item: return_charm, amount: 1 }]
        - [{ adminshop-item: capture_egg, amount: 1 }]
        - [{ material: GOLDEN_APPLE, amount: 2 }]
    middle:
      slots: [15, 16, 17, 18, 19, 20]
      candidates:
        - [{ material: COAL_BLOCK, amount: 4 }]
        - [{ material: IRON_INGOT, amount: 12 }]
        - [{ material: ARROW, amount: 64 }]
        - [{ material: LAPIS_LAZULI, amount: 32 }]
        - [{ material: GOLDEN_APPLE, amount: 1 }]
        - [{ material: GOLD_INGOT, amount: 8 }]
        - [{ material: GOLDEN_CARROT, amount: 16 }]
        - [{ material: EXPERIENCE_BOTTLE, amount: 8 }]
        - [{ adminshop-item: capture_egg, amount: 1 }]
    # 3週間の節目。ここから値の張るものが出る。
    week3:
      slots: [21]
      candidates:
        - [{ material: DIAMOND, amount: 1 }, { material: EXPERIENCE_BOTTLE, amount: 8 }]
        - [{ material: EMERALD, amount: 6 }, { material: EXPERIENCE_BOTTLE, amount: 8 }]
        - [{ material: ENDER_PEARL, amount: 4 }, { material: EXPERIENCE_BOTTLE, amount: 8 }]
    late:
      slots: [22, 23, 24, 25, 26, 27, 29]
      candidates:
        - [{ material: EXPERIENCE_BOTTLE, amount: 16 }]
        - [{ material: EXPERIENCE_BOTTLE, amount: 24 }]
        - [{ material: IRON_BLOCK, amount: 2 }]
        - [{ material: ENDER_PEARL, amount: 4 }]
        - [{ material: OBSIDIAN, amount: 8 }]
        - [{ material: EMERALD, amount: 6 }]
        - [{ material: GOLDEN_APPLE, amount: 2 }]
        - [{ material: DIAMOND, amount: 2 }]
        - [{ adminshop-item: return_charm, amount: 2 }]
        - [{ material: BOOKSHELF, amount: 4 }]
    # 4週間の節目。2月はここが最後のマスになる。
    week4:
      slots: [28]
      candidates:
        - [{ material: DIAMOND, amount: 2 }, { material: EXPERIENCE_BOTTLE, amount: 16 }]
        - [{ adminshop-item: keepsake_charm, amount: 1 }, { material: EXPERIENCE_BOTTLE, amount: 16 }]
        - [{ material: DIAMOND, amount: 1 }, { material: GOLDEN_APPLE, amount: 2 }, { material: EXPERIENCE_BOTTLE, amount: 8 }]
    # 最後のマス。30と31に同じ候補が重ならない。
    final:
      slots: [30, 31]
      candidates:
        - [{ material: DIAMOND, amount: 3 }]
        - [{ material: DIAMOND, amount: 1 }, { adminshop-item: keepsake_charm, amount: 1 }]
        - [{ material: DIAMOND, amount: 2 }, { material: EXPERIENCE_BOTTLE, amount: 16 }]
        - [{ material: EMERALD_BLOCK, amount: 1 }, { material: DIAMOND, amount: 1 }]
  # 抽選の結果に、毎月必ず足すアイテム。
  always:
    # 31日ある月を皆勤した人だけが届くマス。
    31:
      - { material: GOLDEN_APPLE, amount: 1 }

# 紹介報酬。Vault と経済プラグインがない場合は支払いを保留します。
