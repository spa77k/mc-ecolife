name: EcoLifeAssist
version: '${project.version}'
main: dev.spa.ecolife.EcoLifeAssistPlugin
api-version: "26.1.2"
softdepend: [Vault, McLevel, Essentials]
author: spa
description: ログインボーナス・友達招待・Discord通知・ホーム。

commands:
  home:
    description: 登録したホーム1または2へ移動する
    usage: /home [1|2]
  sethome:
    description: ホーム1または2を現在地に登録する
    usage: /sethome [1|2]
  poster:
    description: 運営が用意したポスターを選んで受け取る
    usage: /poster [reload]
  invite:
    description: 友達招待と招待実績
    usage: /invite [名前|top|code 名前|admin]
  daily:
    description: 今月のログインボーナスの進み具合を見る
    usage: /daily
    aliases: [bonus, loginbonus]
  ecolife:
    description: エコライフアシストの管理コマンド
    usage: /ecolife <reload|info|reset|notify status|notify test>

permissions:
  ecolife.home:
    description: ホーム1または2を利用する
    default: true
  ecolife.poster:
    description: ポスター一覧と受け取り
    default: true
  ecolife.poster.admin:
    description: ポスター画像一覧の再読み込み
    default: op
  ecolife.invite:
    description: 友達招待の登録・GUI・ランキング
    default: true
  ecolife.daily:
    description: ログインボーナスの受け取り
    default: true
  ecolife.admin:
    description: 設定の再読み込みと受け取り状況の操作
    default: op
