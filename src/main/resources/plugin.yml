name: EcoLifeAssist
version: '${project.version}'
main: dev.spa.ecolife.EcoLifeAssistPlugin
api-version: "26.1.2"
softdepend: [Vault, McLevel, AdminShop]
author: spa
description: ログインボーナス・友達招待・Discord通知・ポスター・スマホ。

commands:
  phone:
    description: スマホを開く・受け取る
    usage: /phone [get]
  rtp:
    description: 安全な地点へランダムに移動する
    usage: /rtp [world <ワールド>|player <名前> <ワールド>]
  poster:
    description: 運営が用意したポスターを選んで受け取る
    usage: /poster [reload]
  invite:
    description: 友達招待と招待実績
    usage: /invite [名前|top|code 名前|admin]
  daily:
    description: 今月のログインボーナスの進み具合を見る
    usage: /daily
    aliases: [bonus, loginbonus]
  ecolife:
    description: エコライフアシストの管理コマンド
    usage: /ecolife <reload|info|reset|notify status|notify test>

permissions:
  ecolife.phone:
    description: スマホを使う
    default: true
  ecolife.rtp:
    description: 現在のワールドでランダムテレポートする
    default: true
  ecolife.rtp.world:
    description: 別のワールドへランダムテレポートする
    default: op
  ecolife.rtp.admin:
    description: 他のプレイヤーをランダムテレポートする
    default: op
  ecolife.poster:
    description: ポスター一覧と受け取り
    default: true
  ecolife.poster.admin:
    description: ポスター画像一覧の再読み込み
    default: op
  ecolife.invite:
    description: 友達招待の登録・GUI・ランキング
    default: true
  ecolife.daily:
    description: ログインボーナスの受け取り
    default: true
  ecolife.admin:
    description: 設定の再読み込みと受け取り状況の操作
    default: op
