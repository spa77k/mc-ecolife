name: EcoLifeAssist
version: '${project.version}'
main: dev.spa.ecolife.EcoLifeAssistPlugin
api-version: "26.2"
softdepend: [Vault, McLevel, AdminShop, Jobs, Essentials, QuickShop-Hikari]
author: spa
description: ログインボーナス・友達招待・Discord通知・ポスター・スマホ・お墓・借金・自動化装置の検出・石製造機の報酬停止。

commands:
  phone:
    description: スマホを開く・受け取る
    usage: /phone [get]
  rtp:
    description: 安全な地点へランダムに移動する
    usage: /rtp [world <ワールド>|player <名前> <ワールド>|resetfree]
  poster:
    description: 運営が用意したポスターを選んで受け取る
    usage: /poster [reload]
  grave:
    description: 自分のお墓の場所と残り時間を見る
    usage: /grave [all]
    permission: ecolife.grave
  invite:
    description: 友達招待と招待実績
    usage: /invite [名前|top|share|code 名前|admin]
  loan:
    description: 借金の確認・借入・返済
    usage: /loan [borrow <額>|repay <額|all>]
    aliases: [debt]
  daily:
    description: 今月のログインボーナスの進み具合を見る
    usage: /daily
    aliases: [bonus, loginbonus]
  ecolife:
    description: エコライフアシストの管理コマンド
    usage: /ecolife <reload|info|reset|notify status|notify test|automation status|automation test>

permissions:
  ecolife.phone:
    description: スマホを使う
    default: true
  ecolife.rtp:
    description: 現在のワールドでランダムテレポートする
    default: true
  ecolife.rtp.world:
    description: 別のワールドへランダムテレポートする
    default: op
  ecolife.rtp.admin:
    description: 他のプレイヤーをランダムテレポートし、全員の無料枠を戻す
    default: op
  ecolife.poster:
    description: ポスター一覧と受け取り
    default: true
  ecolife.poster.admin:
    description: ポスター画像一覧の再読み込み
    default: op
  ecolife.grave:
    description: 自分のお墓の一覧を見る
    default: true
  ecolife.grave.admin:
    description: 他人のお墓を取り出す・全員のお墓を一覧する
    default: op
  ecolife.loan:
    description: 借金の確認・借入・返済
    default: true
  ecolife.loan.admin:
    description: 全員の借金一覧と帳消し
    default: op
  ecolife.invite:
    description: 友達招待の登録・GUI・ランキング
    default: true
  ecolife.daily:
    description: ログインボーナスの受け取り
    default: true
  ecolife.admin:
    description: 設定の再読み込みと受け取り状況の操作
    default: op
