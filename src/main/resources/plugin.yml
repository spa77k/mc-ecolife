name: EcoLifeAssist
version: '${project.version}'
main: dev.spa.ecolife.EcoLifeAssistPlugin
api-version: "26.1.2"
softdepend: [Vault, McLevel]
author: spa
description: ログインボーナス・友達招待・Discord通知。

commands:
  invite:
    description: 友達招待と招待実績
    usage: /invite [名前|top|code 名前|admin]
  daily:
    description: 今月のログインボーナスの進み具合を見る
    usage: /daily
    aliases: [bonus, loginbonus]
  ecolife:
    description: エコライフアシストの管理コマンド
    usage: /ecolife <reload|info|reset|notify status|notify test>

permissions:
  ecolife.invite:
    description: 友達招待の登録・GUI・ランキング
    default: true
  ecolife.daily:
    description: ログインボーナスの受け取り
    default: true
  ecolife.admin:
    description: 設定の再読み込みと受け取り状況の操作
    default: op
